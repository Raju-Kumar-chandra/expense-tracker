<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monthly Expense Analysis</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{

            background:#f5f7fb;
            font-family:Arial, Helvetica, sans-serif;
        }

        .analysis-card{

            background:white;
            border-radius:25px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);

        }

        .page-title{

            font-size:48px;
            font-weight:700;
            color:#111827;
        }

        .custom-table{

            border-radius:20px;
            overflow:hidden;
        }

        .custom-table thead{

            background:#111827;
            color:white;
        }

        .custom-table th{

            padding:18px;
            font-size:18px;
        }

        .custom-table td{

            padding:20px;
            font-size:17px;
            vertical-align:middle;
        }

        .expense-amount{

            color:#ef4444;
            font-weight:700;
            font-size:20px;
        }

        .month-badge{

            background:#e0f2fe;
            color:#0369a1;
            padding:8px 18px;
            border-radius:30px;
            font-weight:600;
            display:inline-block;
        }

        .table tbody tr:hover{

            background:#f9fafb;
            transition:0.3s;
        }

        .back-btn{

            background:#111827;
            color:white;
            padding:12px 25px;
            border-radius:12px;
            text-decoration:none;
            font-weight:600;
            transition:0.3s;
            display:inline-block;
            margin-bottom:25px;
        }

        .back-btn:hover{

            background:#1f2937;
            color:white;
        }

        @media(max-width:768px){

            .page-title{

                font-size:32px;
            }

            .analysis-card{

                padding:20px;
            }

            .custom-table th,
            .custom-table td{

                padding:12px;
                font-size:14px;
            }

            .expense-amount{

                font-size:16px;
            }

        }

    </style>

</head>

<body>

<div class="container py-5">

    <a
        href="{% url 'dashboard' %}"
        class="back-btn"
    >

        ← Back to Dashboard

    </a>

    <h1 class="page-title mb-5">

        Monthly Expense Analysis

    </h1>

    <div class="analysis-card">

        <div class="table-responsive">

            <table class="table custom-table align-middle">

                <thead>

                    <tr>

                        <th>Month</th>

                        <th>Total Expense</th>

                    </tr>

                </thead>

                <tbody>

                    {% for item in monthly_expenses %}

                    <tr>

                        <td>

                            <span class="month-badge">

                                {{ item.month|date:"F Y" }}

                            </span>

                        </td>

                        <td class="expense-amount">

                            ₹ {{ item.total }}

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
