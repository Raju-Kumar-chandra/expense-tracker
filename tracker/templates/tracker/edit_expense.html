<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
        {% load static %}
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4 p-5">
                    <h2 class="text-center mb-4 fw-bold"> Edit Expense </h2>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-primary w-100"> Update Expense </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
