{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(
                135deg,
                #141e30,
                #243b55
            );
            padding:20px;
            position:relative;
        }

        .edit-container{
            width:100%;
            max-width:500px;
        }

        .edit-card{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .edit-card h1{
            text-align:center;
            margin-bottom:30px;
            color:#111827;
            font-size:36px;
        }

        .input-group{
            margin-bottom:22px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#374151;
        }

        .input-group input,
        .input-group select{
            width:100%;
            padding:14px;
            border:1px solid #d1d5db;
            border-radius:12px;
            font-size:16px;
            transition:0.3s;
            outline:none;
        }

        .input-group input:focus,
        .input-group select:focus{
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,0.3);
        }

        .update-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .update-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        /* Responsive */

        @media(max-width:768px){

            .edit-card{
                padding:25px;
            }

            .edit-card h1{
                font-size:28px;
            }

        }

        .back-btn{
    position:absolute;
    top:20px;
    left:20px;
    text-decoration:none;
    color:white;
    font-size:20px;
    font-weight:bold;
    background:rgba(255,255,255,0.1);
    padding:10px 16px;
    border-radius:10px;
    transition:0.3s;
    backdrop-filter:blur(5px);
}

.back-btn:hover{
    background:white;
    color:#111827;
}

    </style>

</head>

<body>
    <a href="{% url 'dashboard' %}" class="back-btn">   ←  </a>

    <div class="edit-container">

        <div class="edit-card">

            <h1>Edit Expense</h1>

            <form method="POST">

                {% csrf_token %}

                <div class="input-group">

                    <label>Title</label>

                    <input 
                        type="text"
                        name="title"
                        value="{{ expense.title }}"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Amount</label>

                    <input 
                        type="number"
                        step="0.01"
                        name="amount"
                        value="{{ expense.amount }}"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Category</label>

                    <select name="category">

                       <option value="Bills"{% if expense.category == "Bills" %}selected{% endif %}> Bills</option>
                        <option value="Food"{% if expense.category == "Food" %}selected{% endif %}>Food</option>
                        <option value="Travel"{% if expense.category == "Travel" %}selected{% endif %}>Travel</option>
                        <option value="Shopping"{% if expense.category == "Shopping" %}selected{% endif %}>Shopping</option>
                        <option value="Other"{% if expense.category == "Other" %}selected{% endif %}>Other</option>

                    </select>

                </div>

                <button type="submit" class="update-btn">
                    Update Expense
                </button>

            </form>

        </div>

    </div>

</body>
</html>
