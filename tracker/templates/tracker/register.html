<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 p-5 position-relative">
                    <a href="/" class="position-absolute top-0 start-0 m-4 text-dark text-decoration-none fs-3"> ← </a>
                    <h1 class="text-center fw-bold mb-4">
                        Create Account
                    </h1>
                    <form method="POST">
                        {% if form.errors %}
                        <div class="alert alert-danger">
                            {{ form.errors }}
                        </div>
                        {% endif %}
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Username  </label>
                            <input
                             type="text"
                             name="username"
                             value="{{ request.POST.username }}"
                             class="form-control form-control-lg"
                             placeholder="Enter username"
                             required
                            >
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Email </label>
                            <input 
                            type="email"
                            name="email"
                            value="{{ request.POST.email }}"
                            class="form-control form-control-lg"
                            placeholder="Enter email"
                            required
                            >
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold"> Password </label>
                            <div class="mb-3">
                                <div class="input-group">
                                    <input 
                                    type="password"
                                    name="password1"
                                    id="password"
                                    class="form-control form-control-lg"
                                    placeholder="Enter password"
                                    required
                                    >
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">
                                        👁
                                    </button>
                                </div>
                            </div>
                        </div>
                       <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password </label>
                        <div class="input-group">
                            <input
                            type="password"
                            name="password2"
                            id="confirmPassword"
                            class="form-control form-control-lg"
                            placeholder="Confirm password"
                            required
                            >
                            <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="toggleConfirmPassword()"
                            >
                            👁
                            </button>
                        </div>
                    </div>
                        <button class="btn btn-primary btn-lg w-100"> Register </button>
                    </form>
                    <p class="text-center mt-4">
                        Already have an account?
                        <a href="/login/"> Login </a>
                    </p>
                    <div class="text-center mt-3">

                    </div>
                </div>
            </div>
        </div>
    </div>
        <script>

    function togglePassword(){

        const password =
            document.getElementById('password');

        if(password.type === 'password'){

            password.type = 'text';

        }else{

            password.type = 'password';

        }

    }

    function toggleConfirmPassword(){

        const confirmPassword =
            document.getElementById(
                'confirmPassword'
            );

        if(confirmPassword.type === 'password'){

            confirmPassword.type = 'text';

        }else{

            confirmPassword.type = 'password';

        }

    }

</script>
</body>
</html>
