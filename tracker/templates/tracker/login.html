<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
       {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 p-5 position-relative">
                    <a href="/" class="position-absolute top-0 start-0 m-4 text-dark text-decoration-none fs-3">
                        ←
                    </a>
                    <h2 class="text-center mb-4 fw-bold">  Login  </h2>
                    <form method="POST" action="{% url 'login' %}" id="loginForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            
                            <label class="form-label fw-semibold"> Username </label>
                            <input
                                type="text"
                                name="username"
                                class="form-control form-control-lg"
                                placeholder="Enter Username"
                                required
                            >
                        </div>
                       <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                             <input 
                             type="password" 
                             name="password" 
                             id="loginPassword" 
                             class="form-control form-control-lg" 
                             placeholder="Enter password" required
                             >
                             <button type="button" class="btn btn-outline-secondary" onclick="toggleLoginPassword()">
                                👁
                            </button>
                        </div>
                    </div>
                        <button class="btn btn-dark btn-lg w-100"> Login </button>
                    </form>
                    <p class="text-center mt-4">
                        Don't have an account?
                        <a href="{% url 'register' %}">  Register </a>
                    </p>
                    <div class="text-center mt-3">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>

    function toggleLoginPassword(){

        const password =
            document.getElementById(
                'loginPassword'
            );

        if(password.type === 'password'){

            password.type = 'text';

        }else{

            password.type = 'password';

        }

    }

</script>
</body>
</html>
