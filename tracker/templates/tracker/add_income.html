<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Income</title>
   {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4 p-5 position-relative">
                    <a href="/dashboard/" class="position-absolute top-0 start-0 m-4 text-dark text-decoration-none fs-3">
                        ←
                    </a>
                    <h1 class="text-center fw-bold mb-5"> Add Income </h1>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-semibold"> Income Source </label>
                            <input
                                type="text"
                                name="source"
                                class="form-control form-control-lg"
                                placeholder="Enter income source"
                                required
                            >
                        </div>
                        <div class="mb-5">
                            <label class="form-label fw-semibold"> Amount </label>
                            <input
                                type="number"
                                name="amount"
                                class="form-control form-control-lg"
                                placeholder="Enter amount"
                                required
                            >
                        </div>
                        <button class="btn btn-success btn-lg w-100"> Save Income </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
